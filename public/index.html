<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tahfizh App</title>

    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="header-top">
        <span class="header-title">Hello, Admin 👋</span>
        <button class="btn-logout">Logout</button>
      </div>

      <div class="search-box">
        <input type="text" placeholder="Cari..." />
      </div>
    </header>

    <!-- INFO -->
    <section class="card">
      <h3 class="card-title">Info Sekolah</h3>
      <p>Visi: Generasi Qurani</p>
      <p>Misi: Mencetak penghafal Qur'an</p>
    </section>

    <!-- MENU -->
    <section class="menu">
      <div class="menu-item">Tahfizh</div>

      <div class="menu-item menu-clickable" onclick="openModal()">Peserta</div>

      <div class="menu-item">Nilai</div>
      <div class="menu-item">Laporan</div>
      <div class="menu-item">Absensi</div>
      <div class="menu-item">Lainnya</div>
    </section>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <div class="nav-item">Home</div>
      <div class="nav-item">Peserta</div>
      <div class="nav-item">Nilai</div>
      <div class="nav-item">Menu</div>
    </nav>

    <!-- MODAL -->
    <div id="modal" class="modal">
      <div class="modal-content">
        <h3 class="modal-title">Pilih Jenis Peserta</h3>

        <!-- Tahfizh -->
        <div class="dropdown">
          <button class="dropdown-btn" onclick="toggleDropdown('tahfizh')">
            Tahfizh Day
          </button>

          <div id="tahfizh" class="dropdown-content">
            <div onclick="goPage('/peserta/tahfizh-input.html')">Input</div>
            <div onclick="goPage('/peserta/tahfizh-daftar.html')">Daftar</div>
          </div>
        </div>

        <!-- Munaqosah -->
        <div class="dropdown">
          <button class="dropdown-btn" onclick="toggleDropdown('munaqosah')">
            Munaqosah
          </button>

          <div id="munaqosah" class="dropdown-content">
            <div onclick="goPage('/peserta/munaqosah-input.html')">Input</div>
            <div onclick="goPage('/peserta/munaqosah-daftar.html')">Daftar</div>
          </div>
        </div>

        <button class="btn-close" onclick="closeModal()">Tutup</button>
      </div>
    </div>

    <!-- JS -->
    <script src="/app.js"></script>
  </body>
</html>
