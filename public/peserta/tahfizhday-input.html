<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Tahfizh Day</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/tahfizhday.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="header-top">
        <span class="header-title">Hello, Admin 👋</span>
        <button onclick="goBack()" class="btn-logout">← Kembali</button>
      </div>
    </header>

    <!-- FORM -->
    <section class="card">
      <h3 class="card-title">Input Peserta Tahfizh Day</h3>

      <input id="nama" placeholder="Nama peserta" />
      <input id="kelas" placeholder="Kelas" />
      <input id="juz" type="number" placeholder="Juz" />

      <button onclick="handleSubmit()">Simpan</button>

      <!-- tombol toggle list -->
      <button class="btn-secondary" onclick="toggleList()">
        📋 Lihat Daftar
      </button>
    </section>

    <!-- LIST (SPA STYLE) -->
    <section id="listSection" class="card hidden">
      <h3 class="card-title">Daftar Peserta Tahfizh Day</h3>
      <ul id="list"></ul>
    </section>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <div class="nav-item">Home</div>
      <div class="nav-item">Peserta</div>
      <div class="nav-item">Nilai</div>
      <div class="nav-item">Menu</div>
    </nav>

    <script src="/app.js"></script>

    <script>
      function goBack() {
        window.location.href = "/";
      }

      async function handleSubmit() {
        await tambahData("tahfizh");

        // reset form
        document.getElementById("nama").value = "";
        document.getElementById("kelas").value = "";
        document.getElementById("juz").value = "";

        // reload list kalau sedang terbuka
        if (
          !document.getElementById("listSection").classList.contains("hidden")
        ) {
          loadDataTahfizh();
        }
      }

      function toggleList() {
        const section = document.getElementById("listSection");
        section.classList.toggle("hidden");

        if (!section.classList.contains("hidden")) {
          loadDataTahfizh();
        }
      }

      async function loadDataTahfizh() {
        const list = document.getElementById("list");
        if (!list) return;

        const res = await fetch("/api/peserta");
        const data = await res.json();

        const filtered = data.filter((item) => item.jenis === "tahfizh");

        list.innerHTML = "";

        if (filtered.length === 0) {
          list.innerHTML = "<p>Belum ada data</p>";
          return;
        }

        filtered.forEach((item) => {
          const li = document.createElement("li");
          li.innerHTML = `
          <strong>${item.nama}</strong><br>
          Kelas: ${item.kelas}<br>
          Juz: ${item.juz}
        `;
          list.appendChild(li);
        });
      }
    </script>
  </body>
</html>
